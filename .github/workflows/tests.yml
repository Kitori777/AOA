name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Tests and checks (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run MyPy
        run: uv run mypy src tests

      - name: Run test suite
        run: uv run pytest -q
